# Forgejo Runner v13.x config (templated at container start).
# Placeholders __FORGEJO_HOSTNAME__ / __FORGEJO_HOST_IP__ are substituted from
# compose env (git.${LOCAL_DOMAIN_NAME} and ${LOCAL_HOST_IP}).
#
# Generate a fresh defaults file (with full comments) with:
#   docker run --rm code.forgejo.org/forgejo/runner:13.2.1 forgejo-runner generate-config
#
# Before upgrading across a major version, check workflows with:
#   forgejo-runner validate --repository <repo URL or local clone>

log:
  level: info
  # log level for job output (added in v5; default was "trace" before that)
  job_level: info

runner:
  file: .runner  # registration (uuid/token/address) -- unchanged since v3
  capacity: 1
  timeout: 3h
  insecure: false
  fetch_timeout: 30s  # v13 default (was 5s here)
  fetch_interval: 2s
  report_interval: 1s
  envs:
    # Ignore `master` branch name hint
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: master
  labels:
    # Keep ubuntu-latest on a current act image; workflows use runs-on: ubuntu-latest.
    - "ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-24.04"
    - "ubuntu-24.04:docker://ghcr.io/catthehacker/ubuntu:act-24.04"
    - "ubuntu-22.04:docker://ghcr.io/catthehacker/ubuntu:act-22.04"

cache:
  enabled: true
  dir: ""
  host: ""      # auto-detect: the runner's IP on forgejo-ci, reachable from DinD
  port: 0
  proxy_port: 0
  external_server: ""

container:
  # Empty = create a per-job network inside DinD.
  network: ""
  enable_ipv6: false
  privileged: false
  # Job containers run inside DinD and do not inherit the runner's extra_hosts, so:
  # --add-host: so actions/checkout can reach http://git.<lan-domain>/...
  # -v /obsidian-vault-deploy: write built site into the volume served at jrnl.<lan-domain>
  options: "--add-host=__FORGEJO_HOSTNAME__:__FORGEJO_HOST_IP__ -v /obsidian-vault-deploy:/obsidian-vault-deploy"
  workdir_parent:
  valid_volumes:
    - /obsidian-vault-deploy
  # The runner itself talks to DinD through DOCKER_HOST (tcp://docker-in-docker:2375,
  # set in compose). This setting is only about what gets mounted into *job*
  # containers: "-" (or "") = nothing, which is what we want.
  docker_host: "-"
  force_pull: false
  force_rebuild: false

host:
  workdir_parent:

# server.connections (added in v12+) is optional; leaving it unset keeps using
# the registration in `runner.file` (.runner).
