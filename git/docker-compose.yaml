#version: '2.4'

# environmental variables *for Docker Compose* will be loaded from a `.env` file
# in the same directory as this file

services:
  forgejo:
    # defaults to SQLite, but can be configured with a "real" database
    image: codeberg.org/forgejo/forgejo:16
    container_name: forgejo
    environment:
      - USER_UID=${PUID}
      - USER_GID=${PGID}
      - FORGEJO__database__SQLITE_JOURNAL_MODE=WAL
      - FORGEJO__APP_NAME=ForgeJo on Normandie
      - FORGEJO__ui.meta__DESCRIPTION=Git hosting on Normandie
    restart: unless-stopped
    # networks:
    #   - forgejo
    volumes:
      - ${DOCKER_USERDIR}/volumes/forgejo:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 9982:3000
      - "9983:22"
    labels:
      - traefik.enable=true
      - traefik.http.routers.forgejo.rule=Host("git.${LOCAL_DOMAIN_NAME}")
      - traefik.http.services.forgejo.loadbalancer.server.port=3000  # internal port, when multiple ports are exposed

  docker-in-docker:
    image: docker:dind
    container_name: docker_dind
    privileged: true
    command: ['dockerd', '-H', 'tcp://0.0.0.0:2375', '--tls=false']
    volumes:
      # Host path served by frontend `jrnl`
      - ${DOCKER_USERDIR}/volumes/jrnl:/obsidian-vault-deloy
    restart: unless-stopped

  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:3.3.0
    links:
      - docker-in-docker
    depends_on:
      docker-in-docker:
        condition: service_started
    container_name: runner
    extra_hosts:
      # runner is registered against this address, which Docker's DNS can't resolve
      - git.${LOCAL_DOMAIN_NAME}:${LOCAL_HOST_IP}
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2375
      # Substituted into runner-config.yml so *job* containers (DinD) can reach Forgejo
      FORGEJO_HOSTNAME: git.${LOCAL_DOMAIN_NAME}
      FORGEJO_HOST_IP: ${LOCAL_HOST_IP}
    # User without root privileges, but with access to `./data`.
    user: ${PUID}:${PGID}
    volumes:
      - ${DOCKER_USERDIR}/volumes/forgejo-runner:/data
      - ./runner-config.yml:/config/runner-config.yml:ro
    ports:
      - 9984:9984
    restart: 'unless-stopped'
    # command: '/bin/sh -c "while : ; do sleep 1 ; done ;"'  # while doing manual setup
    # Render config so job containers get --add-host=<forgejo hostname>:<LAN IP>
    # (runner extra_hosts alone is not inherited by DinD job containers).
    command:
      - /bin/sh
      - -c
      - |
          sleep 5
          sed -e "s|__FORGEJO_HOSTNAME__|$${FORGEJO_HOSTNAME}|g" \
              -e "s|__FORGEJO_HOST_IP__|$${FORGEJO_HOST_IP}|g" \
              /config/runner-config.yml > /data/config.yml
          exec forgejo-runner daemon --config /data/config.yml


networks:
  default:
    external: true
    name: meta_external
